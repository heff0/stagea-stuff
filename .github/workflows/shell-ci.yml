name: Stagea Astro Shell CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'shell/**'
      - '.github/workflows/shell-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'shell/**'
      - '.github/workflows/shell-ci.yml'

jobs:
  validate-and-build:
    name: Build & Validate Astro Shell
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & Setup PNPM
        run: |
          corepack enable
          corepack prepare pnpm@10.30.0 --activate

      - name: Get PNPM Cache Directory
        id: pnpm-cache
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup PNPM Dependency Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('shell/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Shell Dependencies
        working-directory: shell
        run: pnpm install --frozen-lockfile

      - name: Run Astro Framework Diagnostics (Check)
        working-directory: shell
        run: pnpm check

      - name: Compile Production Assets (Build)
        working-directory: shell
        run: pnpm build

      - name: Validate Docker Compilation (Disposability Dry-Run)
        working-directory: shell
        run: docker build -t stagea-shell:test .
